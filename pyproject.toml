[project]
name = "finance-mcp-demo"
version = "0.1.0"
description = "MCP server that cleans messy company finance exports and serves them to AI agents"
requires-python = ">=3.10"
dependencies = ["mcp>=2.0", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
evals = ["anthropic>=0.40"]

[project.scripts]
finance-mcp = "finance_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
